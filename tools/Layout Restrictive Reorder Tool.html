<html data-type="html" data-identifier="4f5c6e9b-124b-494c-ba81-ca71a90dadf7" data-title="Layout Restrictive Reorder Tool" data-version="3">
<head>
<link href="../css/Layout Restrictive Reorder Tool.css" type="text/css" rel="stylesheet"/>
<link rel="icon" href="../img/favicon.ico" type="image/x-icon">
</head>
<body>

    <header>
        <h1 id="main-title">Strict Layout Reorder</h1>
        <p id="sub-title">Sub-layouts can only be reordered within the same parent category, not moved across directories. </p>
		<div class="logo-container">
		    <div class="logo-icon">
		        <!-- <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg> -->
				<p>C</p>
		    </div>
		    <h1 id="logo_text">CTOOL Platform</h1>
		</div>
    </header>

    <div class="main-container">
        <!-- 左侧树状层级 -->
        <div class="pane left-pane">
            <div class="pane-header">
                <span id="layer-title">Layout Structure</span>
            </div>
            <div class="pane-content" id="tree-root">
                <div style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-top: 50px;" id="placeholder-msg">
                    Please paste JSON data on the right panel, or click “Upload JSON” to import a file and initialize the view
                </div>
            </div>
        </div>

        <!-- 右侧 JSON 输入及输出 -->
        <div class="pane right-pane right_pane">
            <div class="pane-header pane_oper_head">
                <span id="json-title">Action Button</span>
               
            </div>
			<div class="flex-row flex-row_1">
			    <button class="secondary btn_1" id="btn-upload-trigger">Upload JSON</button>
			    <input type="file" id="file-input" accept=".json,text/plain">
			    <button class="secondary btn_1" id="btn-clear">Clear</button>
				<button class="secondary btn_1 reset_btn" id="btn-reset" disabled="">Reset Sorting</button>
			    <!-- <button id="btn-copy">复制 JSON</button> -->
			    <button class="success btn_1" id="btn-download">Download JSON</button>
			</div>
            <div class="pane-content pane_cn">
                <div class="textarea-container">
                    <textarea id="json-input" spellcheck="false" placeholder="在此粘贴 JSON 文本，或通过上方按钮直接上传 JSON 文件..."></textarea>
                    <div class="btn-group">
                        <span id="status-msg" style="margin-left: 10px; font-size: 0.85rem; align-self: center; color: #4ec9b0;"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="../js/reorder.js" type="text/javascript"></script>
<script>
	document.querySelector('.logo-container').addEventListener('click', function() {
	    // window.location.href = './GraFx Json Merger.html';
		// window.open('../toolPlatform.html');
		window.location.href = "../toolPlatform.html";
	});
</script>
</html>
