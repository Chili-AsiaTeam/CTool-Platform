<html data-type="html" data-identifier="4f5c6e9b-124b-494c-ba81-ca71a90dadf7" data-title="Layout Restrictive Reorder Tool" data-version="3">
<head>
<link href="./css/layout_Reorder.css" type="text/css" rel="stylesheet"/>
</head>
<body>

    <header>
        <h1 id="main-title">布局同级排序工具 (Strict Layout Reorder)</h1>
        <p id="sub-title">子布局只能在相同的父级分类内部上下调整位置，严禁移出各自目录层级。支持导入与导出 JSON 文件。</p>
    </header>

    <div class="main-container">
        <!-- 左侧树状层级 -->
        <div class="pane left-pane">
            <div class="pane-header">
                <span id="layer-title">图层/布局结构</span>
            </div>
            <div class="pane-content" id="tree-root">
                <div style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-top: 50px;" id="placeholder-msg">
                    请在右侧粘贴 JSON 数据或点击“上传 JSON”导入文件来初始化视图。
                </div>
            </div>
        </div>

        <!-- 右侧 JSON 输入及输出 -->
        <div class="pane right-pane right_pane">
            <div class="pane-header pane_oper_head">
                <span id="json-title">操作按钮</span>
               
            </div>
			<div class="flex-row flex-row_1">
			    <button class="secondary btn_1" id="btn-upload-trigger">上传 JSON</button>
			    <input type="file" id="file-input" accept=".json,text/plain">
			    <button class="secondary btn_1" id="btn-clear">清空</button>
				<button class="secondary btn_1 reset_btn" id="btn-reset" disabled="">重置排序</button>
			    <!-- <button id="btn-copy">复制 JSON</button> -->
			    <button class="success btn_1" id="btn-download">下载 JSON</button>
			</div>
            <div class="pane-content pane_cn">
                <div class="textarea-container">
                    <textarea id="json-input" spellcheck="false" placeholder="在此粘贴 JSON 文本，或通过上方按钮直接上传 JSON 文件..."></textarea>
                    <div class="btn-group">
                        <span id="status-msg" style="margin-left: 10px; font-size: 0.85rem; align-self: center; color: #4ec9b0;"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="./js/layout_Reoder.js" type="text/javascript"></script>
</html>
