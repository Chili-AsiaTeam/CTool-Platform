<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="../js/merger_sec.js" type="text/javascript"></script>
	<link  href="../css/merger_sec.css" type="text/css" rel="stylesheet"/>
	<link rel="icon" href="../img/favicon.ico" type="image/x-icon">
    <title>Chili GraFx</title>
    <style>
    </style>
</head>
<body>

<!-- 背景科技细线网格 -->
    <div class="grid-background"></div>
	
	<!-- Technical Grid Layer -->
	<div class="grid-overlay"></div>
	
	<!-- Wave Canvas Container -->
	<div id="canvas-wrapper">
	    <canvas id="fluid-canvas"></canvas>
	</div>

<header>
        <div class="logo-container">
            <div class="logo-icon">
                <!-- <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg> -->
				<p>C</p>
            </div>
            <h1 id="main-title">CTOOL Platform</h1>
        </div>
</header>


<div class="container">
    <h2>Chili GraFx Json Merger Sec</h2>
    <p>The first uploaded file will serve as the main container, and the contents of all subsequently added templates will be appended to it in sequence. You can add an unlimited number of files to be merged.</p>

    <div id="file-list">
        <!-- 主文件 (必选, 无法删除) -->
        <div class="file-group" id="group-0">
            <div class="file-info">
                <label>Main template (baseline JSON, e.g., s1.json)</label>
                <input type="file" class="json-input" accept=".json">
            </div>
        </div>
        
        <!-- 第一个子文件 (默认提供, 无法删除) -->
        <div class="file-group" id="group-1">
            <div class="file-info">
                <label>Sub-template 1 (e.g., s2.json)</label>
                <input type="file" class="json-input" accept=".json">
            </div>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-add" onclick="addFileInput()">Add more templates</button>
        <button class="btn btn-merge" id="mergeBtn" onclick="processMerge()">Merge and download JSON</button>
    </div>
    
    <div id="status"></div>
</div>

<script src="../js/toolplatform.js"></script>

	});
</script>

</body></html>
